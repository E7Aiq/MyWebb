name: Update Articles from Notion

on:
  schedule:
    # يعمل كل يوم الساعة 6 صباحاً بتوقيت السعودية (3 صباحاً UTC).
    # مسار المشاريع مُزاح إلى 3:30 — المساران يكتبان ملفّات مولَّدة
    # مشتركة. راجع docs/SEO.md §10.
    - cron: '0 3 * * *'
  workflow_dispatch: # للتشغيل اليدوي من GitHub

jobs:
  fetch-articles:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          npm init -y
          npm install @notionhq/client@2.2.14 notion-to-md@3.1.1 marked@12.0.0 sharp@0.33.4
        
      - name: Fetch articles from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node .github/scripts/fetch-articles.js

      # ── بعد الجلب لا قبله: طبقة البناء تقرأ ما كتبه الجالب ولا تمسّه ────
      - name: Build static pages (pre-render + SEO)
        run: |
          npm install --no-audit --no-fund
          node .github/scripts/build-site.js
          node .github/scripts/check-seo.js

        
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # مجلد الصور شرط لا زينة: صار السكربت ينزّل الأغلفة وصور المتن
          # محلياً، فإن لم تُضَفّ هنا أشارت data/articles.json إلى ملفات
          # غير موجودة في المستودع — وهو ما وقع فعلاً في أول تشغيلة.
          # ‏git add على مسار غير موجود يُفشل الخطوة كلّها — وقد لا يوجد
          # ‏topics/ مثلاً إن خلت البيانات من الوسوم. الحلقة تتسامح مع الغائب،
          # و‎-A تلتقط الحذف أيضاً (الكنس يزيل صفحات ما لم يعد له مصدر).
          for p in data/articles.json assets/images/articles/ articles/ projects/ topics/ a/ p/ assets/og/ data/slugs.json sitemap.xml feed.xml robots.txt .nojekyll index.html articles.html projects.html article.html project-details.html; do
            git add -A -- "$p" 2>/dev/null || true
          done
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 تحديث المقالات من Notion - $(date +'%Y-%m-%d')" && git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)
