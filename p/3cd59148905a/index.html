    <meta property="og:title" content="إستخلاص بيانات مختلف المنشآت من خرائط قوقل">
    <meta property="og:description" content="أداة محلية مفتوحة المصدر تسحب بيانات المنشآت من خرائط قوقل — اسم، تصنيف، مدينة، رقم تواصل تجاري، تقييم — ضمن حقول محددة سلفاً لا تتجاوز البيانات العلنية للأعمال ولا تلمس بيانات الأفراد. تعمل بالكامل على جهازك دون رفع أي شيء لخادم خارجي، ومبنية على ملفات إعداد فتقدر تكيّفها لأي قطاع تحتاجه. الفكرة أنها مصممة من الأساس بضوابط توافق أنظمة حماية البيانات، مو ضوابط تُضاف بعد ما تشتغل الأداة.">
