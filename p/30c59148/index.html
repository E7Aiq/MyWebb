    <meta property="og:description" content="عالمية (منظمة الصحة، البنك الدولي، OWID، اليونيسف، Kaggle، وCDC) في مصدر حقيقة واحد يغطي 236 دولة عبر 75 عاماً. التحدي الحقيقي لم يكن التنظيف، بل توحيد الهوية: 26 قاعدة تصحيح لأسماء دول متضاربة (تركيا/Türkiye، فنزويلا حتى بخطأ إملائي في Kaggle) استعادت مئات الصفوف التي كانت ستُفقد صامتة. القرار الأصعب جاء في التعامل مع الشذوذ: بدل حذف سجلات أعمار متطرفة (أقل من 13 سنة)، وُثّقت كانعكاس لحقائق تاريخية كالإبادة في رواندا، وبدل “تصحيح” تناقض منطقي بين مقياسي العمر الصحي والإجمالي، وُثّق كأثر منهجي يعكس اختلاف أولويات كل منظمة. النتيجة: مسار بيانات لا يُخفي تعارض الأرقام بين المنظمات، بل يكشفه ويتركه للمستخدم ليقرر.">
